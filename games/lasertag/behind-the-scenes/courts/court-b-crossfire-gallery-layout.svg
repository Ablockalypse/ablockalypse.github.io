<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560">
  <rect width="760" height="560" fill="#0f1218"/>
  <text x="24" y="32" fill="#e2e8f0" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" font-weight="600">Court B — Crossfire Gallery · top-down (m)</text>
  <text x="24" y="52" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">32×22 floor · 6 m roof · Arena Sweep · 9 targets / 2 waves</text>
  <!-- court: origin center mapped to (380, 300); scale 10px/m; X right, Z down -->
  <g transform="translate(380,300)">
    <!-- floor -->
    <rect x="-160" y="-110" width="320" height="220" fill="#1a2030" stroke="#64748b" stroke-width="2"/>
    <!-- grid every 2m -->
    <g stroke="#334155" stroke-width="0.5" opacity="0.5">
      <!-- verticals -->
      <path d="M -160,-110 V 110 M -140,-110 V 110 M -120,-110 V 110 M -100,-110 V 110 M -80,-110 V 110 M -60,-110 V 110 M -40,-110 V 110 M -20,-110 V 110 M 0,-110 V 110 M 20,-110 V 110 M 40,-110 V 110 M 60,-110 V 110 M 80,-110 V 110 M 100,-110 V 110 M 120,-110 V 110 M 140,-110 V 110 M 160,-110 V 110"/>
      <path d="M -160,-110 H 160 M -160,-90 H 160 M -160,-70 H 160 M -160,-50 H 160 M -160,-30 H 160 M -160,-10 H 160 M -160,10 H 160 M -160,30 H 160 M -160,50 H 160 M -160,70 H 160 M -160,90 H 160 M -160,110 H 160"/>
    </g>
    <!-- axis -->
    <line x1="0" y1="-110" x2="0" y2="110" stroke="#e8008c" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
    <text x="4" y="-98" fill="#e8008c" font-size="10" font-family="monospace">X=0</text>
    <!-- Home pads -->
    <rect x="-140" y="-20" width="40" height="40" fill="#854d0e" stroke="#fbbf24" stroke-width="2" opacity="0.85"/>
    <text x="-120" y="5" fill="#fde68a" font-size="11" text-anchor="middle" font-family="ui-sans-serif,system-ui">Home A</text>
    <rect x="100" y="-20" width="40" height="40" fill="#854d0e" stroke="#fbbf24" stroke-width="2" opacity="0.85"/>
    <text x="120" y="5" fill="#fde68a" font-size="11" text-anchor="middle" font-family="ui-sans-serif,system-ui">Home B</text>
    <!-- Platform A L -->
    <path d="M -140,-80 L -80,-80 L -80,-30 L -100,-30 L -100,-50 L -140,-50 Z" fill="#334155" stroke="#7dd3fc" stroke-width="2"/>
    <text x="-110" y="-55" fill="#7dd3fc" font-size="10" text-anchor="middle">PlatformA +1.5m</text>
    <!-- Riser B -->
    <rect x="115" y="60" width="30" height="20" fill="#334155" stroke="#7dd3fc" stroke-width="2"/>
    <text x="130" y="73" fill="#7dd3fc" font-size="9" text-anchor="middle">RiserB</text>
    <!-- Spine wall segments (gaps at -40,0,40) -->
    <rect x="-2" y="-70" width="4" height="20" fill="#94a3b8"/>
    <rect x="-2" y="-30" width="4" height="20" fill="#94a3b8"/>
    <rect x="-2" y="10" width="4" height="20" fill="#94a3b8"/>
    <rect x="-2" y="50" width="4" height="20" fill="#94a3b8"/>
    <text x="10" y="-75" fill="#cbd5e1" font-size="9">Spine + peek gaps</text>
    <!-- Offset peek panels -->
    <rect x="-24" y="55" width="8" height="3" fill="#e2e8f0"/>
    <rect x="16" y="-58" width="8" height="3" fill="#e2e8f0"/>
    <!-- Bunkers -->
    <rect x="-115" y="15" width="18" height="10" fill="#475569" stroke="#94a3b8"/>
    <rect x="92" y="42" width="18" height="10" fill="#475569" stroke="#94a3b8"/>
    <rect x="102" y="-28" width="18" height="10" fill="#475569" stroke="#94a3b8"/>
    <rect x="82" y="-68" width="18" height="10" fill="#475569" stroke="#94a3b8"/>
    <!-- Crates -->
    <rect x="-105" y="35" width="10" height="10" fill="#64748b"/>
    <rect x="-95" y="-55" width="10" height="10" fill="#64748b"/>
    <rect x="95" y="-5" width="10" height="10" fill="#64748b"/>
    <rect x="75" y="25" width="10" height="10" fill="#64748b"/>
    <!-- Spawns -->
    <circle cx="-120" cy="0" r="5" fill="#22c55e"/><text x="-120" y="-10" fill="#86efac" font-size="9" text-anchor="middle">spawn_red</text>
    <circle cx="120" cy="0" r="5" fill="#22c55e"/><text x="120" y="-10" fill="#86efac" font-size="9" text-anchor="middle">spawn_blue</text>
    <!-- W1 targets cyan -->
    <g fill="#22d3ee" stroke="#0891b2" stroke-width="1">
      <circle cx="-80" cy="60" r="5"/><text x="-80" y="72" fill="#a5f3fc" font-size="8" text-anchor="middle">T1</text>
      <circle cx="-60" cy="-40" r="5"/><text x="-60" y="-48" fill="#a5f3fc" font-size="8" text-anchor="middle">T2</text>
      <circle cx="-20" cy="0" r="5"/><text x="-20" y="-10" fill="#a5f3fc" font-size="8" text-anchor="middle">T3</text>
      <circle cx="20" cy="50" r="5"/><text x="20" y="62" fill="#a5f3fc" font-size="8" text-anchor="middle">T4</text>
      <circle cx="0" cy="-60" r="5"/><text x="0" y="-68" fill="#a5f3fc" font-size="8" text-anchor="middle">T5</text>
    </g>
    <!-- W2 targets magenta -->
    <g fill="#e879f9" stroke="#c026d3" stroke-width="1">
      <circle cx="80" cy="40" r="5"/><text x="80" y="52" fill="#f5d0fe" font-size="8" text-anchor="middle">T6</text>
      <circle cx="100" cy="-30" r="5"/><text x="100" y="-38" fill="#f5d0fe" font-size="8" text-anchor="middle">T7</text>
      <circle cx="70" cy="-70" r="5"/><text x="70" y="-78" fill="#f5d0fe" font-size="8" text-anchor="middle">T8</text>
      <circle cx="40" cy="10" r="5"/><text x="40" y="22" fill="#f5d0fe" font-size="8" text-anchor="middle">T9</text>
    </g>
  </g>
  <!-- legend -->
  <g font-family="ui-sans-serif,system-ui" font-size="11" fill="#cbd5e1">
    <text x="24" y="520">Legend:</text>
    <circle cx="90" cy="516" r="5" fill="#22d3ee"/><text x="100" y="520">W1 target</text>
    <circle cx="180" cy="516" r="5" fill="#e879f9"/><text x="190" y="520">W2 target</text>
    <circle cx="280" cy="516" r="5" fill="#22c55e"/><text x="290" y="520">spawn</text>
    <rect x="360" y="508" width="16" height="12" fill="#334155" stroke="#7dd3fc"/><text x="382" y="520">raised</text>
    <rect x="450" y="508" width="16" height="12" fill="#475569"/><text x="472" y="520">bunker/crate</text>
    <text x="580" y="520" fill="#94a3b8">10 px = 1 m</text>
  </g>
</svg>
