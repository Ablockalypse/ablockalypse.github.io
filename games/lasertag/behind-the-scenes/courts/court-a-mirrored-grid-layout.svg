<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560">
  <rect width="760" height="560" fill="#0f1218"/>
  <text x="24" y="32" fill="#e2e8f0" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" font-weight="600">Court A — Mirrored Grid · top-down (m)</text>
  <text x="24" y="52" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">32×22 floor · 6 m roof · Arena Sweep · dual-home mirrored · L1 The Grid</text>
  <!-- court: origin center mapped to (380, 300); scale 10px/m; X right, Z down -->
  <g transform="translate(380,300)">
    <!-- floor -->
    <rect x="-160" y="-110" width="320" height="220" fill="#1a2030" stroke="#64748b" stroke-width="2"/>
    <!-- grid every 2m -->
    <g stroke="#334155" stroke-width="0.5" opacity="0.5">
      <path d="M -160,-110 V 110 M -140,-110 V 110 M -120,-110 V 110 M -100,-110 V 110 M -80,-110 V 110 M -60,-110 V 110 M -40,-110 V 110 M -20,-110 V 110 M 0,-110 V 110 M 20,-110 V 110 M 40,-110 V 110 M 60,-110 V 110 M 80,-110 V 110 M 100,-110 V 110 M 120,-110 V 110 M 140,-110 V 110 M 160,-110 V 110"/>
      <path d="M -160,-110 H 160 M -160,-90 H 160 M -160,-70 H 160 M -160,-50 H 160 M -160,-30 H 160 M -160,-10 H 160 M -160,10 H 160 M -160,30 H 160 M -160,50 H 160 M -160,70 H 160 M -160,90 H 160 M -160,110 H 160"/>
    </g>
    <!-- mirror axis -->
    <line x1="0" y1="-110" x2="0" y2="110" stroke="#e8008c" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
    <text x="4" y="-98" fill="#e8008c" font-size="10" font-family="monospace">X=0 mirror</text>
    <!-- Side platforms ±11..±16 (raised +0.8m) -->
    <rect x="-160" y="-110" width="50" height="220" fill="#334155" stroke="#7dd3fc" stroke-width="2" opacity="0.9"/>
    <rect x="110" y="-110" width="50" height="220" fill="#334155" stroke="#7dd3fc" stroke-width="2" opacity="0.9"/>
    <text x="-135" y="-95" fill="#7dd3fc" font-size="10" text-anchor="middle">Platform A</text>
    <text x="-135" y="-83" fill="#67e8f9" font-size="8" text-anchor="middle">+0.8 m</text>
    <text x="135" y="-95" fill="#7dd3fc" font-size="10" text-anchor="middle">Platform B</text>
    <text x="135" y="-83" fill="#67e8f9" font-size="8" text-anchor="middle">+0.8 m</text>
    <!-- Stairs markers (inner edge of platforms, z≈±8) -->
    <g fill="none" stroke="#7dd3fc" stroke-width="1.5">
      <path d="M -110,-85 L -100,-85 L -100,-75 L -110,-75"/>
      <path d="M -110,75 L -100,75 L -100,85 L -110,85"/>
      <path d="M 110,-85 L 100,-85 L 100,-75 L 110,-75"/>
      <path d="M 110,75 L 100,75 L 100,85 L 110,85"/>
    </g>
    <text x="-105" y="-90" fill="#67e8f9" font-size="7" text-anchor="middle">stairs</text>
    <text x="105" y="-90" fill="#67e8f9" font-size="7" text-anchor="middle">stairs</text>
    <!-- Mid peek panels (center gap at Z≈0) -->
    <rect x="-29" y="35" width="59" height="4" fill="#94a3b8"/>
    <rect x="-29" y="-39" width="59" height="4" fill="#94a3b8"/>
    <text x="0" y="28" fill="#cbd5e1" font-size="9" text-anchor="middle">peek panels · center gap</text>
    <!-- Flank corridor panels (mirrored) -->
    <rect x="-54" y="61" width="4" height="35" fill="#94a3b8"/>
    <rect x="-54" y="-96" width="4" height="35" fill="#94a3b8"/>
    <rect x="50" y="61" width="4" height="35" fill="#94a3b8"/>
    <rect x="50" y="-96" width="4" height="35" fill="#94a3b8"/>
    <!-- Home bunkers (mirrored) -->
    <rect x="-97" y="28" width="5" height="31" fill="#475569" stroke="#94a3b8"/>
    <rect x="-97" y="-59" width="5" height="31" fill="#475569" stroke="#94a3b8"/>
    <rect x="92" y="28" width="5" height="31" fill="#475569" stroke="#94a3b8"/>
    <rect x="92" y="-59" width="5" height="31" fill="#475569" stroke="#94a3b8"/>
    <!-- Crates (key mirrored cover — public clean set) -->
    <rect x="-6" y="-4" width="12" height="8" fill="#64748b"/>
    <rect x="-70" y="26" width="12" height="8" fill="#64748b"/>
    <rect x="-70" y="-34" width="12" height="8" fill="#64748b"/>
    <rect x="58" y="26" width="12" height="8" fill="#64748b"/>
    <rect x="58" y="-34" width="12" height="8" fill="#64748b"/>
    <rect x="-48" y="47" width="12" height="8" fill="#64748b"/>
    <rect x="-48" y="-55" width="12" height="8" fill="#64748b"/>
    <rect x="36" y="47" width="12" height="8" fill="#64748b"/>
    <rect x="36" y="-55" width="12" height="8" fill="#64748b"/>
    <rect x="-22" y="77" width="12" height="8" fill="#64748b"/>
    <rect x="-22" y="-85" width="12" height="8" fill="#64748b"/>
    <rect x="10" y="77" width="12" height="8" fill="#64748b"/>
    <rect x="10" y="-85" width="12" height="8" fill="#64748b"/>
    <!-- Home pads (amber) at spawn_x ≈ ±8.25 m -->
    <rect x="-93.5" y="-11" width="22" height="22" fill="#854d0e" stroke="#fbbf24" stroke-width="2" opacity="0.85"/>
    <text x="-82.5" y="5" fill="#fde68a" font-size="11" text-anchor="middle" font-family="ui-sans-serif,system-ui">Home A</text>
    <rect x="71.5" y="-11" width="22" height="22" fill="#854d0e" stroke="#fbbf24" stroke-width="2" opacity="0.85"/>
    <text x="82.5" y="5" fill="#fde68a" font-size="11" text-anchor="middle" font-family="ui-sans-serif,system-ui">Home B</text>
    <!-- Spawns -->
    <circle cx="-82.5" cy="0" r="5" fill="#22c55e"/><text x="-82.5" y="-18" fill="#86efac" font-size="9" text-anchor="middle">spawn_red</text>
    <circle cx="82.5" cy="0" r="5" fill="#22c55e"/><text x="82.5" y="-18" fill="#86efac" font-size="9" text-anchor="middle">spawn_blue</text>
    <!-- flank lane notes -->
    <text x="0" y="-102" fill="#64748b" font-size="8" text-anchor="middle">flank corridor</text>
    <text x="0" y="108" fill="#64748b" font-size="8" text-anchor="middle">flank corridor</text>
  </g>
  <!-- legend — clean cover/spawn (no per-target markers for public diagram) -->
  <g font-family="ui-sans-serif,system-ui" font-size="11" fill="#cbd5e1">
    <text x="24" y="520">Legend:</text>
    <circle cx="90" cy="516" r="5" fill="#22c55e"/><text x="100" y="520">spawn</text>
    <rect x="160" y="508" width="16" height="12" fill="#854d0e" stroke="#fbbf24"/><text x="182" y="520">home pad</text>
    <rect x="270" y="508" width="16" height="12" fill="#334155" stroke="#7dd3fc"/><text x="292" y="520">raised platform</text>
    <rect x="420" y="508" width="16" height="12" fill="#475569"/><text x="442" y="520">bunker / cover</text>
    <rect x="560" y="508" width="16" height="12" fill="#94a3b8"/><text x="582" y="520">peek panel</text>
    <text x="680" y="520" fill="#94a3b8">10 px = 1 m</text>
  </g>
</svg>
